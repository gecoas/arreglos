name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-arreglos
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to production network
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy by SSH
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${PROD_HOST:?Falta PROD_HOST}"
          : "${PROD_USER:?Falta PROD_USER}"
          : "${PROD_SSH_KEY:?Falta PROD_SSH_KEY}"
          test "$PROD_USER" = deploy

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "$PROD_USER@$PROD_HOST" "
            set -euo pipefail
            mkdir -p /opt/proyectos/arreglos
            cd /opt/proyectos/arreglos
            if [ ! -d .git ]; then git init -q; fi
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin git@github-gecoas-prod:gecoas/arreglos.git
            else
              git remote add origin git@github-gecoas-prod:gecoas/arreglos.git
            fi
            git fetch -q origin '$GITHUB_SHA'
            git checkout -q --detach --force '$GITHUB_SHA'
            INTRANET_DATABASE_URL=\$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' intranet-api | grep -m1 '^DATABASE_URL=' | cut -d '=' -f2-)
            test -n "\$INTRANET_DATABASE_URL"
            export INTRANET_DATABASE_URL
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          "

      - name: Verify production API
        run: curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors https://arreglos.gecoas.es/health
