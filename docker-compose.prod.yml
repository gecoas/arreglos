services:
  arreglos-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: arreglos-api:prod
    container_name: arreglos-api
    restart: unless-stopped
    environment:
      INTRANET_DATABASE_URL: ${INTRANET_DATABASE_URL:?INTRANET_DATABASE_URL must be set}
      INTRANET_API_URL: http://intranet:80
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - intranet_network

  arreglos:
    build:
      context: .
      dockerfile: Dockerfile
    image: arreglos:prod
    container_name: arreglos
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intranet_network
    ports:
      - "5173:80"

networks:
  intranet_network:
    external: true
    name: intranet_default
